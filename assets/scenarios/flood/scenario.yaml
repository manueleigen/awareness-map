# yaml-language-server: $schema=../../../schemas/scenario.schema.json
id: flood
active: true

text:
  de:
    title: Der Fluss tritt über die Ufer
    short_title: Flut
    description: |
      **Nach tagelangen Regenfällen** hat der Pegel kritische Werte erreicht. Das Hochwasserschutzsystem steht vor einer Zerreißprobe.

      Übernimm eine Rolle und hilf dabei, die Situation unter Kontrolle zu bringen.
  en:
    title: The River Overflows Its Banks
    short_title: Flood
    description: |
      **After days of heavy rainfall**, water levels have reached critical values. The flood protection system is facing a severe test.

      Take on a role and help bring the situation under control.

roles:
  - id: fire_brigade
    text:
      de:
        title: Feuerwehr
      en:
        title: Fire Brigade
    challenge: ./fire_brigade/challenge.yaml
  - id: police
    text:
      de:
        title: Polizei
      en:
        title: Police
    challenge: ./police/challenge.yaml
  - id: crisis_unit
    text:
      de:
        title: Krisenstab
      en:
        title: Crisis Unit
    challenge: ./crisis_unit/challenge.yaml
