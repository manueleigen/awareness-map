# yaml-language-server: $schema=../../../../schemas/challenge.schema.json
story_points:
  - id: intro
    type: quiz
    optionsLayout: rows
    text:
      de:
        title: 'Wofür steht die Abkürzung "PSNV"?'
      en:
        title: 'What does "PSNV" stand for?'
    options:
      - value: "A"
        text:
          de: "Psychische Soforthilfe nach Vorfällen"
          en: "Psychological Support for Sudden Incidents"
      - value: "B"
        text:
          de: "Psychosoziale Notfallversorgung"
          en: "Psychosocial Emergency Care"
      - value: "C"
        text:
          de: "Persönlicher Schutz in Notfalllagen"
          en: "Personal Safety in Emergency Situations"
    solution: ["B"]
    next:
      correct: intro2
      wrong: wrong-screen

  - id: wrong-screen
    type: info
    text:
      de:
        title: Leider falsch
        description: |
          Die PSNV unterstützt Menschen in Krisen und Notlagen psychosozial, zum Beispiel durch Betreuung, Orientierung und persönliche Ansprache.

          **Versuche es nochmal!**
      en:
        title: Wrong Answer
        description: |
          PSNV provides psychosocial support to people in crises and emergencies, for example through care, guidance, and personal support.

          **Try again!**
    next: intro

  - id: intro2
    type: info
    showLayersById: [blackout_psnv_support_sites]
    text:
      de:
        title: Anlaufstellen auswählen
        description: |
          Im Blackout brauchen viele Menschen Orientierung, Ruhe und psychosoziale Unterstützung.

          **Wähle zwei Orte aus, an denen psychosoziale Anlaufstellen aufgebaut werden sollen.**
        button: "Herausforderung starten"
      en:
        title: Select Support Sites
        description: |
          During a blackout, many people need orientation, calm, and psychosocial support.

          **Select two locations where psychosocial support sites should be set up.**
        button: "Start Challenge"
    next: challenge_core

  - id: challenge_core
    type: point-selection-quiz
    target: "#layer-blackout_psnv_support_sites"
    hintLayerOverlaysById: [blackout_psnv_support_sites]
    hintLayerOverlayDuration: 99999999
    showLayersById: [blackout_psnv_support_sites]
    solution: ["blackout_psnv_site_01", "blackout_psnv_site_05"]
    minSelection: 2
    maxSelection: 2
    text:
      de:
        title: Anlaufstellen aufbauen
        question: |
          **Wähle genau zwei Orte aus.**

          Berücksichtige:

          - wie viele Menschen dort versorgt werden können
          - die Einwohnerdichte und Erreichbarkeit
          - ob der Standort geeignet ist, um Schutz und Orientierung zu bieten
      en:
        title: Set Up Support Sites
        question: |
          **Select exactly two locations.**

          Take into account:

          - how many people can be supported there
          - population density and accessibility
          - whether the site offers shelter and orientation
    next:
      correct: correct-screen
      partly-correct: partly-correct-screen
      partly-critical: partly-critical-screen
      weak-fail: weak-fail-screen
      all-noncritical-fail: all-noncritical-fail-screen
      all-critical-fail: fail-screen-1

