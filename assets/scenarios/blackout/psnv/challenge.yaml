# yaml-language-server: $schema=../../../../schemas/challenge.schema.json
story_points:
  - id: intro
    type: quiz
    optionsLayout: rows
    text:
      de:
        title: "Wofür steht die Abkürzung PSNV?"
      en:
        title: "What does the abbreviation PSNV stand for?"
    options:
      - value: "A"
        text:
          de: "Psychische Soforthilfe nach Vorfällen"
          en: "Psychological Support for Sudden Incidents"
      - value: "B"
        text:
          de: "Psychosoziale Notfallversorgung"
          en: "Psychosocial Emergency Care"
      - value: "C"
        text:
          de: "Persönlicher Schutz in Notfalllagen"
          en: "Personal Safety in Emergency Situations"
    solution: ["B"]
    next:
      right: intro2
      wrong: quiz-wrong-screen

  - id: quiz-wrong-screen
    type: info
    text:
      de:
        title: Leider falsch
        description: |
          Die PSNV unterstützt Menschen in Krisen und Notlagen psychosozial, zum Beispiel durch Betreuung, Orientierung und persönliche Ansprache.

          **Versuche es nochmal!**
      en:
        title: Wrong Answer
        description: |
          PSNV provides psychosocial support to people in crises and emergencies, for example through care, guidance, and personal support.

          **Try again!**
    next: intro

  - id: intro2
    type: info
    showLayersById: [blackout_psnv_support_sites]
    text:
      de:
        title: Versorgungspunkte auswählen
        description: |
          Im Blackout brauchen viele Menschen Orientierung, Ruhe und psychosoziale Unterstützung.

          **Wähle zwei Orte aus, an denen Versorgungspunkte aufgebaut werden sollen.**
        button: "Herausforderung starten"
      en:
        title: Select Support Sites
        description: |
          During a blackout, many people need orientation, calm, and psychosocial support.

          **Select two locations where support points should be set up.**
        button: "Start Challenge"
    next: challenge_core

  - id: challenge_core
    type: point-selection-quiz
    target: "#layer-blackout_psnv_support_sites"
    hintLayerOverlaysById: [blackout_psnv_support_sites]
    hintLayerOverlayDuration: 99999999
    showLayersById: [blackout_psnv_support_sites]
    solution: ["blackout_psnv_site_01", "blackout_psnv_site_05"]
    minSelection: 2
    maxSelection: 2
    text:
      de:
        title: Versorgungspunkte aufbauen
        question: |
          **Wähle genau zwei Orte aus.**

          Berücksichtige:

          - wie viele Menschen dort versorgt werden können
          - die Einwohnerdichte und Erreichbarkeit
          - ob der Standort geeignet ist, um Schutz und Orientierung zu bieten
      en:
        title: Set Up Support Points
        question: |
          **Select exactly two locations.**

          Take into account:

          - how many people can be reached there
          - whether the site offers shelter and orientation
          - which areas are currently less well served
    next:
      right: psnv-general-quiz
      half: half-fail-screen
      half-wrong: half-wrong-screen
      wrong-neutral: fail-screen-wrong-neutral
      all-neutral: fail-screen-all-neutral
      all-wrong: fail-screen-1

  - id: psnv-general-quiz
    type: quiz
    optionsLayout: rows
    showLayersById: [blackout_psnv_support_sites]
    text:
      de:
        title: Was leistet die PSNV?
      en:
        title: What Does PSNV Do?
    options:
      - value: "A"
        text:
          de: "Menschen stabilisieren, Orientierung geben und Betroffene begleiten"
          en: "Stabilize people, provide orientation, and support those affected"
      - value: "B"
        text:
          de: "Stromversorgung und mobile Funktechnik wiederherstellen"
          en: "Restore power supply and mobile communications technology"
      - value: "C"
        text:
          de: "Straßen sperren und Evakuierungen polizeilich durchsetzen"
          en: "Block roads and enforce evacuations through police action"
    solution: ["A"]
    next:
      right: win-screen
      wrong: psnv-quiz-fail-screen

  - id: psnv-quiz-fail-screen
    type: end-screen
    result: failed
    text:
      de:
        title: Leider falsch
        description: |
          PSNV unterstützt Menschen in akuten Belastungssituationen psychosozial.

          **Versuche es nochmal.**
      en:
        title: Not Quite
        description: |
          PSNV provides psychosocial support to people in acute stress situations.

          **Try again.**

  - id: win-screen
    type: end-screen
    result: passed
    showLayersById: [blackout_psnv_support_sites]
    text:
      de:
        title: Challenge gelöst!
        description: |
          Du hast geeignete Versorgungspunkte ausgewählt und die Aufgabe der PSNV richtig erkannt.
      en:
        title: Challenge Solved!
        description: |
          You selected suitable support sites and correctly identified the role of PSNV.

  - id: half-fail-screen
    type: end-screen
    result: failed
    text:
      de:
        title: Teilweise richtig
        description: |
          Einer deiner Orte ist gut geeignet, der andere erreicht zu wenige Menschen oder bietet zu wenig Schutz.
      en:
        title: Partly Correct
        description: |
          One of your locations is suitable, but the other reaches too few people or offers too little shelter.

  - id: half-wrong-screen
    type: end-screen
    result: failed
    text:
      de:
        title: Ungünstige Kombination
        description: |
          Du hast einen passenden Ort gewählt, aber auch einen Standort, der für Versorgungspunkte zu wenig geeignet ist.
      en:
        title: Weak Combination
        description: |
          You chose one suitable site, but also one location that is not well suited for support points.

  - id: fail-screen-wrong-neutral
    type: end-screen
    result: failed
    text:
      de:
        title: Schlechte Priorisierung
        description: |
          Ein gewählter Ort ist ungeeignet, der andere bringt nur wenig zusätzliche Wirkung.
      en:
        title: Poor Prioritization
        description: |
          One selected site is unsuitable, while the other adds only limited impact.

  - id: fail-screen-all-neutral
    type: end-screen
    result: failed
    text:
      de:
        title: Zu geringe Wirkung
        description: |
          Deine Auswahl nutzt die knappen PSNV-Ressourcen nicht dort, wo sie die meisten Menschen erreichen.
      en:
        title: Too Little Impact
        description: |
          Your selection does not use scarce PSNV resources where they would reach the most people.

  - id: fail-screen-1
    type: end-screen
    result: failed
    text:
      de:
        title: Fehlgeschlagen
        description: |
          Deine Auswahl war nicht optimal für den Aufbau der Versorgungspunkte.
      en:
        title: Failed
        description: |
          Your selection was not optimal for setting up the support points.
