  - id: correct-screen
    type: end-screen
    result: passed
    showLayersById: [blackout_psnv_support_sites]
    text:
      de:
        title: Challenge gelöst!
        description: |
          Du hast geeignete Anlaufstellen ausgewählt!
          
          **Gut gemacht!**
      en:
        title: Challenge Solved!
        description: |
          You selected suitable support sites!

          **Well done!**

  - id: partly-correct-screen
    type: end-screen
    result: failed
    text:
      de:
        title: Teilweise richtig
        description: |
          Einer deiner Orte ist gut geeignet, der andere erreicht zu wenige Menschen oder bietet zu wenig Schutz.
      en:
        title: Partly Correct
        description: |
          One of your locations is suitable, but the other reaches too few people or offers too little shelter.

  - id: partly-critical-screen
    type: end-screen
    result: failed
    text:
      de:
        title: Ungünstige Kombination
        description: |
          Du hast einen passenden Ort gewählt, aber auch einen Standort, der für psychosoziale Anlaufstellen zu wenig geeignet ist.
      en:
        title: Weak Combination
        description: |
          You chose one suitable site, but also one location that is not well suited for psychosocial support sites.

  - id: weak-fail-screen
    type: end-screen
    result: failed
    text:
      de:
        title: Schlechte Priorisierung
        description: |
          Ein gewählter Ort ist ungeeignet, der andere bringt nur wenig zusätzliche Wirkung.
      en:
        title: Poor Prioritization
        description: |
          One selected site is unsuitable, while the other adds only limited impact.

  - id: all-noncritical-fail-screen
    type: end-screen
    result: failed
    text:
      de:
        title: Zu geringe Wirkung
        description: |
          Deine Auswahl nutzt die knappen PSNV-Ressourcen nicht dort, wo sie die meisten Menschen erreichen.
      en:
        title: Too Little Impact
        description: |
          Your selection does not use scarce PSNV resources where they would reach the most people.

  - id: fail-screen-1
    type: end-screen
    result: failed
    text:
      de:
        title: Fehlgeschlagen
        description: |
          Deine Auswahl war nicht optimal für den Aufbau der Anlaufstellen.
      en:
        title: Failed
        description: |
          Your selection was not optimal for setting up the support sites.
