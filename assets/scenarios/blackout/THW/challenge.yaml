# yaml-language-server: $schema=../../../../schemas/challenge.schema.json
story_points:
  - id: intro
    type: quiz
    text:
      de:
        title: 'Wofür steht die Abkürzung "THW"?'
      en:
        title: 'What does "THW" stand for?'
    options:
      - value: "A"
        text:
          de: "Technische Hauptwache"
          en: "Technical Main Guard"
      - value: "B"
        text:
          de: "Trupp für Heimatschutz und Wiederaufbau"
          en: "Troop for Homeland Protection and Reconstruction"
      - value: "C"
        text:
          de: "Technisches Hilfswerk"
          en: "Technical Relief Organization"
    solution: ["C"]
    optionsLayout: rows
    next:
      correct: intro2
      wrong: wrong-screen
  
  - id: wrong-screen
    type: info
    text:
      de:
        title: "Leider falsch"
        description: |
          Das THW leistet technische Hilfe bei Katastrophen, Unglücken und anderen Notlagen.

          **Versuche es nochmal!**
      en:
        title: "Unfortunately Incorrect"
        description: |
          The THW provides technical assistance during disasters, accidents, and other emergencies.

          **Try again!**
    next: intro
  - id: intro2
    type: info
    showLayersById: [blackout_THW_critical_sites]
    hideLayersById: [critical_sites]
    text:
      de:
        title: "Infrastruktur braucht Notstrom"
        description: |
          Das THW hilft im Krisenfall dabei, kritische Infrastruktur mit Notstrom funktionsfähig zu halten.

          **Setze die verfügbaren Ressourcen gezielt ein, um wichtige Einrichtungen zu schützen und die Folgen für die Bevölkerung zu begrenzen.**
        button: "Challenge starten"
      en:
        title: "Critical Infrastructure Needs Power"
        description: |
          The THW helps keep critical infrastructure functioning with backup power during emergencies.

          **Use the available resources strategically to protect key facilities and limit the impact on the population.**
        button: "Start Challenge"
    next: challenge_core

  - id: challenge_core
    type: point-selection-quiz

    target: "#layer-blackout_THW_critical_sites"
    showLayersById: [blackout_THW_critical_sites]
    # hintLayerOverlaysById: [blackout_THW_critical_sites]
    # hintLayerOverlayDuration: 99999999
    solution: ["blackout_thw_poi_01", "blackout_thw_poi_02", "blackout_thw_poi_04"]
    wrong_options: ["blackout_thw_poi_05"]
    minSelection: 3
    maxSelection: 3
    text:
      de:
        title: Notstromversorgung stabilisieren
        question: |
          **Wähle die drei kritischsten Infrastrukturen aus**, die zuerst mit den begrenzten Notstromaggregaten stabilisiert werden sollen. Berücksichtige dabei:

          - den aktuellen Status jeder Einrichtung
          - die Folgen eines Ausfalls für die Bevölkerung
      en:
        title: Stabilize Backup Power
        question: |
          **Select the three most critical infrastructure facilities** that should be stabilized first with the limited emergency generators. Consider:

          - the current status of each facility
          - the consequences of a failure for the population
    next:
      correct: correct-screen
      partly-correct: partly-correct-screen
      partly-critical: partly-critical-screen
      weak-fail: partly-critical-screen
      all-noncritical-fail: partly-correct-screen
      all-critical-fail: partly-critical-screen
      wrong: partly-correct-screen


  - id: correct-screen
    type: end-screen
    result: passed
    showLayersById: [blackout_THW_critical_sites]
    text:
      de:
        title: Einsatz erfolgreich!
        description: |
          Du hast die begrenzten Notstromaggregate dort eingesetzt, wo ein Ausfall die größten Folgen hätte.

          Abwasserpumpwerk, Lagezentrum und Trinkwasserwerk bleiben stabil. Damit sind Abwasserentsorgung, Einsatzkoordination und Trinkwasserversorgung auch während des Blackouts abgesichert.

          **Ausgezeichnet!**
      en:
        title: Operation Successful!
        description: |
          You deployed the limited emergency generators where a failure would have the greatest consequences.

          The wastewater pumping station, crisis coordination center, and drinking water plant remain stable. This keeps wastewater management, response coordination, and drinking water supply secured during the blackout.

          **Excellent work!**

  - id: partly-correct-screen
    type: end-screen
    result: failed
    text:
      de:
        title: Teilweise richtig
        description: |
          Du hast mindestens eine kritische Infrastruktur richtig priorisiert, aber nicht alle verfügbaren Notstromaggregate erreichen die Standorte mit der höchsten Dringlichkeit.

          **Prüfe Status und Auswirkungen jeder Einrichtung noch einmal.**
      en:
        title: Partly Correct
        description: |
          You correctly prioritized at least one critical infrastructure site, but not all available emergency generators are being sent to the locations with the highest urgency.

          **Review the status and impact of each facility again.**

  - id: partly-critical-screen
    type: end-screen
    result: failed
    text:
      de:
        title: Kritische Versorgungslücke
        description: |
          Du hast mindestens eine zentrale Infrastruktur richtig erkannt, aber ein Notstromaggregat am Kraftstoffdepot gebunden.

          **Das Depot ist wichtig für den weiteren Einsatz, aber weniger dringlich als andere Standorte, bei denen unmittelbar Ausfälle drohen.**

          Setze das Notstromaggregat an einem anderen Standort ein.
      en:
        title: Critical Supply Gap
        description: |
          You correctly identified at least one key infrastructure site, but assigned one emergency generator to the fuel depot.

          **The depot is important for continued operations, but it is less urgent than other locations where failures are imminent.**

          Deploy the emergency generator to a different site.
