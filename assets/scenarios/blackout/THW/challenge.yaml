# yaml-language-server: $schema=../../../../schemas/challenge.schema.json
story_points:
  - id: intro
    type: quiz
    text:
      de:
        title: "THW Quiz"
        question: "Wofür steht die Abkürzung THW?"
      en:
        title: "THW Quiz"
        question: "What does the abbreviation THW stand for?"
    options:
      - value: "A"
        text:
          de: "Technische Hauptwache"
          en: "Technical Main Guard"
      - value: "B"
        text:
          de: "Trupp für Heimatschutz und Wiederaufbau"
          en: "Troop for Homeland Protection and Reconstruction"
      - value: "C"
        text:
          de: "Technisches Hilfswerk"
          en: "Technical Relief Organization"
    solution: ["C"]
    next:
      right: intro2
      wrong: quiz-wrong-screen
  
  - id: quiz-wrong-screen
    type: info
    text:
      de:
        title: "Falsche Antwort"
        description: |
          Das Technische Hilfswerk (THW) ist eine Organisation, die bei Katastrophen und Notlagen hilft.

          **Versuche es nochmal!**
      en:
        title: "Wrong Answer"
        description: |
          The Technical Relief Organization (THW) is an organization that helps during disasters and emergencies.

          **Try again!**
    next: intro
  - id: intro2
    type: info
    text:
      de:
        title: "Kritische Infrastruktur braucht Notstrom"
        description: |
          In diesem Szenario bist du als Einsatzleiter:in des THW verantwortlich für die Koordination von Notstromversorgung und die Aufrechterhaltung kritischer Infrastruktur während eines großflächigen Stromausfalls.

          **Deine Aufgabe ist es, die verfügbaren Ressourcen effektiv einzusetzen, um die wichtigsten Einrichtungen zu schützen und die Auswirkungen auf die Bevölkerung zu minimieren.**
      en:
        title: "Critical Infrastructure Needs Backup Power"
        description: |
          In this scenario, you are the THW operations manager responsible for coordinating backup power and maintaining critical infrastructure during a widespread blackout.

          **Your task is to deploy available resources effectively to protect key facilities and minimize impacts on the population.**
        
    next: challenge_core

  - id: challenge_core
    type: point-selection-quiz

    target: "#layer-blackout_THW_critical_sites"
    showLayersById: [blackout_THW_critical_sites]
    solution: ["blackout_thw_poi_01", "blackout_thw_poi_02", "blackout_thw_poi_04"]
    wrong_options: ["blackout_thw_poi_05"]
    minSelection: 3
    maxSelection: 3
    text:
      de:
        title: Notstromversorgung stabilisieren
        question: |
          **Wähle die drei kritischsten Infrastrukturen aus, die deine begrenzten Notstromaggregate erhalten sollen.**

          Berücksichtige:

          - den aktuellen Status jeder Einrichtung
          - die Auswirkungen auf die Bevölkerung
          - welche Einrichtungen die höchste Priorität haben
      en:
        title: Stabilize Backup Power
        question: |
          **Select the three most critical infrastructure facilities that should receive your limited backup power generators.**

          Consider:

          - the current status of each facility
          - the impact on the population
          - which facilities have the highest priority
    next:
      right: win-screen
      half: half-fail-screen
      half-wrong: half-wrong-screen
      wrong-neutral: fail-screen-wrong-neutral
      all-neutral: fail-screen-all-neutral
      all-wrong: fail-screen-1

  - id: win-screen
    type: end-screen
    result: passed
    showLayersById: [blackout_THW_critical_sites]
    text:
      de:
        title: Einsatz erfolgreich!
        description: |
          Du hast die begrenzten Notstromaggregate dort eingesetzt, wo ein Ausfall die größten Folgen hätte.

          Abwasserpumpwerk, Koordinationszentrum und Trinkwasserwerk bleiben stabil. Damit sind Entsorgung, Einsatzkoordination und Trinkwasserversorgung auch während des Blackouts abgesichert.

          **Ausgezeichnet!**
      en:
        title: Operation Successful!
        description: |
          You deployed the limited backup generators where a failure would have the greatest consequences.

          The wastewater pumping station, coordination center, and drinking water works remain stable. This keeps sanitation, response coordination, and drinking water supply secured during the blackout.

          **Excellent work!**

  - id: half-fail-screen
    type: end-screen
    result: failed
    text:
      de:
        title: Teilweise richtig
        description: |
          Du hast mindestens eine kritische Infrastruktur richtig priorisiert, aber nicht alle verfügbaren Aggregate erreichen die Standorte mit der höchsten Dringlichkeit.

          Einige deiner gewählten Einrichtungen sind aktuell noch stabiler als Abwasserpumpwerk, Koordinationszentrum oder Trinkwasserwerk.

          **Prüfe Status und Auswirkungen jeder Einrichtung noch einmal.**
      en:
        title: Partly Correct
        description: |
          You correctly prioritized at least one critical infrastructure site, but not all available generators are going to the most urgent locations.

          Some of the facilities you selected are currently more stable than the wastewater pumping station, coordination center, or drinking water works.

          **Review each facility's status and impact again.**

  - id: half-wrong-screen
    type: end-screen
    result: failed
    text:
      de:
        title: Kritische Versorgungslücke
        description: |
          Du hast mindestens eine zentrale Infrastruktur richtig erkannt, aber ein Aggregat an das Kraftstoffdepot gebunden.

          Das Depot ist wichtig für den weiteren Einsatz, löst aber nicht die akut drohenden Ausfälle bei Entsorgung, Koordination oder Trinkwasserversorgung.

          **Setze das Aggregat zuerst an einem unmittelbar kritischen Standort ein.**
      en:
        title: Critical Supply Gap
        description: |
          You correctly identified at least one key infrastructure site, but tied one generator to the fuel depot.

          The depot matters for continued operations, but it does not solve the imminent failures in sanitation, coordination, or drinking water supply.

          **Deploy that generator to an immediately critical site first.**

  - id: fail-screen-wrong-neutral
    type: end-screen
    result: failed
    text:
      de:
        title: Falsche Priorität
        description: |
          Deine Auswahl enthält das Kraftstoffdepot, aber keinen der unmittelbar kritischen Standorte.

          Gleichzeitig bleiben Einrichtungen unversorgt, deren Ausfall viele Menschen direkt treffen würde: Abwasserpumpwerk, Koordinationszentrum und Trinkwasserwerk.

          **Priorisiere zuerst die Standorte mit kritischem oder stark begrenztem Status und hoher Auswirkung auf die Bevölkerung.**
      en:
        title: Wrong Priority
        description: |
          Your selection includes the fuel depot, but none of the immediately critical sites.

          At the same time, facilities whose failure would directly affect many people remain unsupported: the wastewater pumping station, coordination center, and drinking water works.

          **Prioritize sites with critical or heavily limited status and high public impact first.**

  - id: fail-screen-all-neutral
    type: end-screen
    result: failed
    text:
      de:
        title: Zu geringe Dringlichkeit
        description: |
          Deine Auswahl konzentriert sich auf Einrichtungen, die derzeit noch stabiler laufen.

          Währenddessen drohen beim Abwasserpumpwerk, beim Koordinationszentrum und beim Trinkwasserwerk gravierende Ausfälle mit direkter Wirkung auf viele Menschen.

          **Nutze die Aggregate für die Standorte mit der höchsten Dringlichkeit.**
      en:
        title: Not Urgent Enough
        description: |
          Your selection focuses on facilities that are currently still more stable.

          Meanwhile, the wastewater pumping station, coordination center, and drinking water works are at risk of severe failures with direct impact on many people.

          **Use the generators for the sites with the highest urgency.**

  - id: fail-screen-1
    type: end-screen
    result: failed
    text:
      de:
        title: Fehlgeschlagen
        description: |
          Deine Auswahl war nicht optimal für die Lage im Blackout.

          **Kritische Infrastruktur blieb unversorgt, während begrenzte Notstromressourcen an weniger dringenden Standorten gebunden waren.**
      en:
        title: Failed
        description: |
          Your selection was not optimal for the blackout situation.

          **Critical infrastructure remained unsupported while limited backup power resources were tied up at less urgent sites.**
