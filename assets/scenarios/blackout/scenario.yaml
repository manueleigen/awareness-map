# yaml-language-server: $schema=../../../schemas/scenario.schema.json
id: blackout
active: true

text:
  de:
    title: "Mehr als ein Stromausfall: Blackout"
    short_title: Blackout
    description: |
      **Ein großflächiger Stromausfall** legt seit Montag, 10:00 Uhr die Stadt lahm.
      Inzwischen ist es Dienstag, 14:00 Uhr. 
      Nach rund **28 Stunden ohne Strom** wird die Lage vor allem durch **Folgeprobleme wie Notstromversorgung, Wasserversorgung und Kommunikation** bestimmt.

      Übernimm eine Rolle und hilf dabei, die Situation unter Kontrolle zu bringen.
  en:
    title: "More than a Power Outage: Blackout"
    short_title: Blackout
    description: |
      **A large-scale power outage** has paralyzed the city since Monday, 10:00 AM.
      It is now Tuesday, 2:00 PM. 
      After about **28 hours without power**, the situation is mainly shaped by **secondary problems such as backup power, water supply, and communication**.

      Take on a role and help bring the situation under control.
