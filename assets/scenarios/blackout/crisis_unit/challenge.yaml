# yaml-language-server: $schema=../../../../schemas/challenge.schema.json
story_points:
  - id: intro
    type: info
    text:
      de:
        title: "Kommunikation aufrecherhalten"
        description: |
          
          Der **Krisenstab** muss im Katastrophenfall dafür sorgen, dass Prioritäten geklärt sind und Ressourcen sinnvoll verteilt werden. 
          Ein wichtiger Aspekt bei einem Blackout ist **Information und Kommunikation**.
          
          Prüfe den Status der Kommunikation in der Stadt und achte dabei auf kritische Orte, die besonders auf Kommunikation angewiesen sind.
        button: "Herausforderung starten"
      en:
        title: "Maintaining Communication"
        description: |
          The **crisis unit** is responsible for clarifying priorities and allocating resources in a sensible way during a disaster. 
          An important aspect during a blackout is **information and communication**.
          
          Check the status of communication in the city, paying special attention to critical sites that are particularly dependent on communication.

        button: "Start Challenge"
    next: challenge_core

  - id: challenge_core
    type: area-selection-quiz
    target: "#layer-blackout_crisis_unit_districts"
    showLayersById: [blackout_crisis_unit_districts, critical_sites]
    solution: ["area-11", "area-21", "area-29"]
    wrong_options: ["area-1", "area-24", "area-36"]
    minSelection: 3
    maxSelection: 3
    text:
      de:
        title: Bezirke priorisieren
        question: |
          **Wähle drei Bezirke aus**, in denen lokale Informationsknoten und Kommunikation gestärkt werden sollen.
          **Berücksichtige dabei**:

          - kritische Kommunikationslage
          - hohe Bevölkerungsdichte
          - kritische Orte in der Nähe
      en:
        title: Secure Three Districts First
        question: |
          **Select three districts where local communication and information nodes should be reinforced first.**

          Take into account:

          - critical communication conditions
          - high population density
          - critical sites nearby
    next:
      right: wifi-placement
      half: half-fail-screen
      half-wrong: half-wrong-screen
      wrong-neutral: fail-screen-wrong-neutral
      all-neutral: fail-screen-all-neutral
      all-wrong: fail-screen-all-wrong


  - id: wifi-placement
    type: coordinates-quiz
    showLayersById: [blackout_crisis_unit_info_points]
    hintLayerOverlaysById: [blackout_crisis_unit_info_points]
    hideLayersById: [critical_sites]
    target: "#layers"
    initial_position:
      x: 500
      y: 500
    solution: ["{x: 2170, y: 1560}"]
    maxDistance: 300
    submit:
      de: WLAN-Punkt platzieren
      en: Place Wi-Fi Point
    text:
      de:
        title: Mobilen Informationspunkt platzieren
        question: |
          **Setze den mobilen WLAN-Punkt dort, wo bestehende Info-Anlaufstationen die geringste Abdeckung erzeugen.**

          Berücksichtige dabei:

          - vorhandene Anlaufstationen
          - schlecht versorgte Bereiche
          - kritische Orte in der Nähe
      en:
        title: Place Mobile Wi-Fi Point
        question: |
          **Place the mobile Wi-Fi point where existing information stations leave the largest coverage gap.**

          Take into account:

          - existing support stations
          - poorly covered areas
          - nearby critical sites
    next:
      right: win-screen
      wrong: wifi-fail-screen

  - id: wifi-fail-screen
    type: end-screen
    result: failed
    text:
      de:
        title: Nicht optimal platziert
        description: |
          Dort gibt es bereits vergleichsweise mehr Abdeckung.

          Suche den Bereich, der von bestehenden Anlaufstationen am wenigsten erreicht wird.
      en:
        title: Not Optimally Placed
        description: |
          That area already has comparatively more coverage.

          Look for the area least reached by the existing support stations.

  - id: win-screen
    type: end-screen
    result: passed
    text:
      de:
        title: Strategisch richtig priorisiert
        description: |
          Du hast die Bezirke ausgewählt, in denen **kritische Kommunikation, hohe Dichte und geringe Erreichbarkeit** zusammenfallen.
      en:
        title: Strategically Prioritized
        description: |
          You selected the districts where **critical communication, high density, and poor accessibility** overlap.

  - id: half-fail-screen
    type: end-screen
    result: failed
    text:
      de:
        title: Teilweise tragfähige Priorisierung
        description: |
          Ein Teil deiner Auswahl war richtig, aber nicht alle gewählten Bezirke haben die größte strategische Wirkung.
      en:
        title: Partly Effective Prioritization
        description: |
          Part of your selection was correct, but not all chosen districts create the greatest strategic effect.

  - id: half-wrong-screen
    type: end-screen
    result: failed
    text:
      de:
        title: Gemischte Prioritäten
        description: |
          Du hast einen stark belasteten Bezirk erkannt, aber auch einen Bereich priorisiert, der strategisch weniger Wirkung entfaltet.
      en:
        title: Mixed Priorities
        description: |
          You identified one highly stressed district, but also prioritized an area with less strategic impact.

  - id: fail-screen-wrong-neutral
    type: end-screen
    result: failed
    text:
      de:
        title: Strategisch zu schwach
        description: |
          Deine Auswahl enthält einen Bezirk, der bereits besser angebunden ist oder das Lagebild nur wenig verbessert.
      en:
        title: Strategically Too Weak
        description: |
          Your selection includes a district that is already better connected or would only marginally improve the overall situation.

  - id: fail-screen-all-neutral
    type: end-screen
    result: failed
    text:
      de:
        title: Wirkung unterschätzt
        description: |
          Du hast belastete Bereiche gewählt, aber nicht die Bezirke mit der höchsten Wirkung.
      en:
        title: Impact Underestimated
        description: |
          You selected affected areas, but not the districts with the strongest combined impact.

  - id: fail-screen-all-wrong
    type: end-screen
    result: failed
    text:
      de:
        title: Ressourcen falsch gebunden
        description: |
          Du hast Bezirke priorisiert, in denen zusätzliche Kommunikationsknoten **nicht die größte Entlastung** erzeugen.
      en:
        title: Resources Misallocated
        description: |
          You prioritized districts where additional communication nodes **do not create the greatest relief**.
