# yaml-language-server: $schema=../../../../schemas/challenge.schema.json
story_points:
  - id: intro
    type: info
    text:
      de:
        title: "Kommunikation aufrechterhalten"
        description: |
          
          Der **Krisenstab** muss im Katastrophenfall dafür sorgen, dass Prioritäten geklärt sind und Ressourcen sinnvoll verteilt werden.
          Ein wichtiger Aspekt bei einem Blackout ist **Information und Kommunikation**.
          
          Prüfe die Kommunikationslage in der Stadt und achte dabei auf Bezirke, in denen schlechte Erreichbarkeit, hohe Belastung und wichtige Einrichtungen zusammenkommen.
        button: "Herausforderung starten"
      en:
        title: "Maintaining Communication"
        description: |
          The **crisis unit** is responsible for clarifying priorities and allocating resources effectively during a disaster.
          An important aspect during a blackout is **information and communication**.
          
          Check the communication situation in the city, paying special attention to districts where poor accessibility, high pressure, and key facilities overlap.

        button: "Start Challenge"
    next: challenge_core

  - id: challenge_core
    type: area-selection-quiz
    target: "#layer-blackout_crisis_unit_districts"
    showLayersById: [blackout_crisis_unit_districts]
    solution: ["area-11", "area-21", "area-29"]
    critical_items: ["area-1", "area-24", "area-36"]
    minSelection: 3
    maxSelection: 3
    text:
      de:
        title: Lage prüfen und Bezirke priorisieren
        question: |
          Identifiziere die Bezirke, in denen zusätzliche Kommunikationsknoten die größte Wirkung hätten.
          
          **Wähle drei Bezirke aus**, in denen schlechte Kommunikationslage, hohe Bevölkerungsdichte und wichtige Einrichtungen zusammenkommen.
      en:
        title: Assess the Situation and Prioritize Districts
        question: |
          Identify the districts where additional communication nodes would have the greatest effect.

          **Select three districts where poor communication, high population density, and key facilities overlap.**

    next:
      correct: wifi-placement
      partly-correct: partly-correct-screen-area-selection
      critical: critical-screen-area-selection
      wrong: wrong-screen-area-selection



  - id: correct-screen-coordinates
    type: end-screen
    result: passed
    text:
      de:
        title: Richtig priorisiert
        description: |
          Du hast die Bezirke mit der größten strategischen Wirkung erkannt.

          **Gut gemacht!** 
      en:
        title: Strategically Prioritized
        description: |
          You prioritized the districts with the greatest strategic effect and placed the mobile communication point where existing coverage was weakest.

  - id: partly-correct-screen-area-selection
    type: end-screen
    result: failed
    text:
      de:
        title: Teilweise richtige Priorisierung
        description: |
          Ein Teil deiner Auswahl war richtig, aber nicht alle gewählten Bezirke haben die größte strategische Wirkung.
          Achte auf:

          - kritische Kommunikationslage (in rot markiert)
          - hohe Bevölkerungsdichte
          - wichtige Einrichtungen
      en:
        title: Partly Effective Prioritization
        description: |
          Part of your selection was correct, but not all chosen districts create the greatest strategic effect.

  - id: wrong-screen-area-selection
    type: end-screen
    result: failed
    text:
      de:
        title: Nicht optimal entschieden
        description: |
          Deine Entscheidung erzeugt **nicht die größtmögliche Entlastung** für die Kommunikationslage.

          Prüfe noch einmal, wo schlechte Kommunikationslage, hohe Bevölkerungsdichte und wichtige Einrichtungen zusammenkommen.
      en:
        title: Not Optimally Decided
        description: |
          Your decision does **not create the greatest possible relief** for the communication situation.

          Review where poor communication, high population density, and key facilities overlap.

  - id: critical-screen-area-selection
    type: end-screen
    result: failed
    text:
      de:
        title: Kritische Fehlpriorisierung
        description: |
          Deine Auswahl enthält mindestens einen Bezirk, der trotz begrenzter Ressourcen nicht priorisiert werden sollte.

          Achte auf die Kombination aus kritischer Kommunikationslage, hoher Bevölkerungsdichte und wichtigen Einrichtungen.
      en:
        title: Critical Misprioritization
        description: |
          Your selection includes at least one district that should not be prioritized while resources are limited.

          Focus on the combination of poor communication, high population density, and key facilities.



  - id: wifi-placement
    type: coordinates-quiz
    icon: 'assets/icons/wifi-router.svg'
    showLayersById: [blackout_crisis_unit_info_points]
    hideLayersById: [critical_sites]
    target: "#layers"
    initial_position:
      x: 500
      y: 500
    solution: ["{x: 2170, y: 1560}"]
    maxDistance: 300
    submit:
      de: Mobilen Kommunikationspunkt platzieren
      en: Place Mobile Communication Point
    text:
      de:
        title: Krisen-Kommunikationsnetz aufbauen
        question: |
          Ein unabhängiges Krisennetz verbindet wichtige Akteure und Infrastrukturen auch dann, wenn Strom und Telekommunikation ausfallen.

          **Setze den mobilen Kommunikationspunkt dort, wo bestehende Kommunikationspunkte die größte Lücke lassen.**

      en:
        title: Establish Crisis Communication Network
        question: |
          An independent crisis communication network connects key actors and infrastructure even when power and telecommunications fail.

          **Place the mobile communication point where the existing communication points leave the largest gap.**
    next:
      correct: correct-screen-coordinates
      wrong: wrong-screen-coordinates

  - id: wrong-screen-coordinates
    type: end-screen
    result: failed
    text:
      de:
        title: Nicht optimal platziert
        description: |
          Dort gibt es bereits vergleichsweise mehr Abdeckung.

          Suche den Bereich, der von bestehenden Kommunikationspunkten am wenigsten erreicht wird.
      en:
        title: Not Optimally Placed
        description: |
          That area already has comparatively more coverage or low population density.

          Look for a relevant area least reached by the existing communication points.
