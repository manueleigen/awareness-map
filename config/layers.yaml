layer_types:
  static_image:
    type: static-image
    interaction: none

  locations:
    type: locations
    interaction: inspect-location
    icon_mode: per-location

  area_overlay:
    type: areas
    interaction: inspect-area

  lottie_sequence:
    type: lottie-sequence
    interaction: timeline
    playback_control: true

  pulsing_overlay:
    type: pulsing-image
    interaction: inspect-area

  png_sequence:
    type: png-sequence
    interaction: timeline
    playback_control: true

  svg_sequence:
    type: svg-sequence
    interaction: timeline
    playback_control: true
  