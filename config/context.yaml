# yaml-language-server: $schema=../schemas/context.schema.json
global:
  validator_overlay: true
  layers:
    - id: base_layer_river
      layer_type: static_image
      available_from: global
      toggle: hidden
      initially_visible: true
      z_index: 10
      src: /assets/scenarios/global/base-layer_river.webp

    - id: base_layer_buildings
      layer_type: static_image
      available_from: global
      toggle: hidden
      initially_visible: true
      z_index: 71
      src: /assets/scenarios/global/buildings.webp

    - id: base_layer_streets
      layer_type: static_image
      available_from: global
      toggle: hidden
      initially_visible: true
      z_index: 60
      src: /assets/scenarios/global/streets.webp

    - id: base_layer_glow
      layer_type: static_image
      available_from: global
      toggle: hidden
      class: glow-layer
      initially_visible: true
      z_index: 40
      src: /assets/scenarios/global/glow.webp

    - id: critical_sites
      layer_type: locations
      available_from: global
      toggle: available
      label:
        de: "Kritische\nInfrastruktur"
        en: "Critical\nInfrastructure"
      initially_visible: false
      z_index: 110
      toggle_order: 1
      src: /assets/scenarios/global/critical_sites.json
      icon: /assets/icons/critical_sites.svg
      poi_icon: /assets/icons/marker_poi.svg

    - id: population_density
      layer_type: static_image
      available_from: global
      toggle: available
      label:
        de: "Bevölkerungs\ndichte"
        en: "Population\nDensity"
      opacity_control: true
      initially_visible: false
      z_index: 74
      toggle_order: 2
      src: /assets/scenarios/global/density.webp
      icon: /assets/icons/population_density.svg

scenarios:
  - id: flood
    layers:
      - id: flood_simulation
        layer_type: svg_sequence
        available_from: scenario
        toggle: available
        label:
          de: "Flut\nSimulation"
          en: "Flood\nSimulation"
        start_time: "08:00"
        end_time: "18:00"
        initially_visible: true
        z_index: 78
        toggle_order: 3
        src: /assets/scenarios/flood/flood_sim_svg/manifest.json
        icon: /assets/icons/flood.svg
        slider_icon: /assets/icons/flood-slider.svg

    roles:
      - id: fire_brigade
        exclude_layers: [flood_police_evacuation_zones]
        layers:
          - id: flood_fire_brigade_emergency_calls
            layer_type: locations
            available_from: role
            toggle: available
            label:
              de: "Aktuelle\nNotrufe"
              en: "Emergency\nCalls"
            initially_visible: true
            z_index: 100
            toggle_order: 4
            src: /assets/scenarios/flood/fire_brigade/emergency_calls.json
            icon: /assets/icons/emergency_calls.svg
            poi_icon: /assets/icons/marker_emergency_call.svg

      - id: police
        layers:
          - id: flood_police_evacuation_zones
            layer_type: area_overlay
            available_from: role
            toggle: available
            quiz_only: true
            label:
              de: "Evakuierungs\nzonen"
              en: "Evacuation\nZones"
            initially_visible: false
            z_index: 77
            toggle_order: 5
            src: /assets/scenarios/flood/police/evacuation_zones.svg
            icon: /assets/icons/evacuation_zones.svg

      - id: crisis_unit
        exclude_layers: [flood_police_evacuation_zones]
        layers:
          - id: flood_crisis_unit_social_media
            layer_type: locations
            available_from: role
            toggle: available
            label:
              de: Social Media
              en: Social Media
            initially_visible: true
            z_index: 180
            toggle_order: 4
            src: /assets/scenarios/flood/crisis_unit/social_media.json
            icon: /assets/icons/social_media.svg
            poi_icon: /assets/icons/marker_social_media.svg

          - id: flood_crisis_unit_drone_feed
            layer_type: pulsing_overlay
            available_from: role
            toggle: hidden
            quiz_only: true
            initially_visible: false
            z_index: 80
            toggle_order: 5
            src: /assets/scenarios/flood/crisis_unit/drone_unten.webp
            src_overlay: /assets/scenarios/flood/crisis_unit/drone_oben.webp

  - id: blackout
    layers: []
    roles:
      - id: thw
        layers:
          - id: blackout_THW_critical_sites
            layer_type: locations
            available_from: role
            toggle: hidden
            quiz_only: true
            label:
              de: "Kritische\nStandorte"
              en: "Critical\nSites"
            initially_visible: true
            z_index: 112
            toggle_order: 3
            src: /assets/scenarios/blackout/THW/critical_sites.json
            icon: /assets/icons/critical_sites.svg
            playback_control: false
            start_time: "10:00"
            end_time: "22:00"
            status_poi_icons:
              stable: /assets/icons/thw_marker_poi_stable.svg
              limited: /assets/icons/thw_marker_poi_limited.svg
              critical: /assets/icons/thw_marker_poi_critical.svg
      - id: psnv
        layers:
          - id: blackout_psnv_support_sites
            layer_type: locations
            available_from: role
            toggle: hidden
            quiz_only: true
            initially_visible: true
            label:
              de: "Mögliche\nAnlaufstellen"
              en: "Potential\nSupport Sites"
            z_index: 103
            toggle_order: 3
            src: /assets/scenarios/blackout/psnv/support_sites.json
            icon: /assets/icons/critical_sites.svg
            poi_icon: /assets/icons/marker_poi.svg
      - id: crisis_unit
        layers:
          - id: blackout_crisis_unit_districts
            layer_type: area_overlay
            available_from: role
            toggle: available
            quiz_only: false
            label:
              de: "Kommunikations\nlage"
              en: "Communication\nStatus"
            initially_visible: false
            z_index: 79
            toggle_order: 3
            src: /assets/scenarios/blackout/crisis_unit/districts.svg
            icon: /assets/icons/communications.svg
            area_colors:
              - color: "#dff3d1"
                areas: [area-1, area-2, area-7, area-8]
              - color: "#ffe6a6"
                areas: [area-10, area-11, area-14, area-15, area-20]
              - color: "#f7b7b7"
                areas: [area-22, area-23, area-34, area-35, area-40]
          - id: blackout_crisis_unit_info_points
            layer_type: locations
            available_from: role
            toggle: hidden
            quiz_only: true
            label:
              de: "Informations\npunkte"
              en: "Info\nPoints"
            initially_visible: false
            z_index: 102
            toggle_order: 4
            src: /assets/scenarios/blackout/crisis_unit/info_points.json
            poi_icon: /assets/icons/marker_cmmunications.svg

